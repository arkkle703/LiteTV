plugins {
    id 'com.android.library'
}

android {
    namespace = "com.github.tvbox.osc.player"
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Media3 marks most of its API surface @UnstableApi; the opt-in check would fail the
        // release build for calls the library itself documents as the intended way to use it
        // (custom load-error policies, cache data sources, the OkHttp data source, ...).
        disable 'UnstableApiUsage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    implementation "com.squareup.okhttp3:okhttp:3.12.11"
    // AndroidX Media3, the maintained successor of ExoPlayer. Pinned to 1.4.1 on purpose: it is
    // the last release that compiles against this project's compileSdk 34 (1.5+ demands
    // compileSdk 35, which in turn needs a newer AGP than 8.2), while still supporting minSdk 21
    // and shipping pieces the player previously hand-rolled, such as the OkHttp data source.
    api "androidx.media3:media3-exoplayer:1.4.1"
    api "androidx.media3:media3-exoplayer-hls:1.4.1"
    api "androidx.media3:media3-exoplayer-dash:1.4.1"
    api "androidx.media3:media3-datasource-okhttp:1.4.1"
    api "androidx.media3:media3-database:1.4.1"
}
