name: Build APK

# 推到任意分支、或者手动点 Run workflow 都会打一次包。
# 产物在 Actions 页面的 Artifacts 里下载（按 ABI 分开：arm64-v8a 是电视盒子/电视最常用的）。
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs
        # 上游的 gradle.properties 被 .gitignore 忽略（里面放签名口令），
        # 所以 AndroidX 开关在命令行上传，仓库里就不用提交任何敏感文件。
        #
        # 堆内存必须给够：splits 会并行打 4 个 ABI 的包，
        # 默认堆在 packageDebug 阶段会抛 OutOfMemoryError: Java heap space。
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: ./gradlew :app:assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: litetv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
